<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TrumpVIX</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="header-center">
        <img src="/static/logo.svg" alt="Logo" class="header-logo" />
        <h1>TrumpVIX</h1>
      </div>
      <div class="header-vix">
        <div id="vix-inline" class="vix-inline"></div>
      </div>
    </header>

    <main class="stack">
      <div class="search-bar" id="searchBar">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search keywords..." autocomplete="off" />
        <button class="search-clear" id="searchClear" aria-label="Clear search">&times;</button>
        <div class="search-divider"></div>
        <button class="reaction-toggle-btn" id="reactionToggleBtn" aria-label="Toggle market reactions">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span>Reactions</span>
        </button>
        <div class="search-divider"></div>
        <button class="refresh-btn" id="refreshBtn" aria-label="Fetch latest data" title="Fetch latest data">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <div class="search-divider"></div>
        <button class="date-picker-btn" id="datePickerBtn" aria-label="Pick date">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </button>
        <div class="date-dropdown" id="dateDropdown">
          <input type="date" id="datePicker" />
          <div class="date-dropdown-btns">
            <button class="date-clear-btn" id="dateClearBtn">Clear</button>
            <button class="date-go-btn" id="dateGoBtn">Go</button>
          </div>
        </div>
      </div>

      <div class="content-area" id="contentArea">
        <div class="reaction-side reaction-side-left" id="reactionLeft"></div>

        <section class="timeline-carousel" aria-label="Statement timeline">
          <div class="carousel-viewport" id="carouselViewport">
            <div class="carousel-track" id="carouselTrack"></div>
          </div>
        </section>

        <div class="reaction-side reaction-side-right" id="reactionRight"></div>
      </div>
    </main>

    <div class="timeline-bar" id="timelineBar">
      <button class="nav-btn nav-prev" id="prevBtn" aria-label="Older post">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 4l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="timeline-dots" id="timelineDots"></div>
      <button class="nav-btn nav-next" id="nextBtn" aria-label="Newer post">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M7 4l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <script>
    (() => {
      const searchInput = document.getElementById("searchInput");
      const searchClear = document.getElementById("searchClear");
      const datePickerBtn = document.getElementById("datePickerBtn");
      const datePicker = document.getElementById("datePicker");
      const reactionToggleBtn = document.getElementById("reactionToggleBtn");
      const reactionLeft = document.getElementById("reactionLeft");
      const reactionRight = document.getElementById("reactionRight");
      const searchBar = document.getElementById("searchBar");

      const carouselTrack = document.getElementById("carouselTrack");
      const carouselViewport = document.getElementById("carouselViewport");
      const timelineDots = document.getElementById("timelineDots");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const vixInlineEl = document.getElementById("vix-inline");
      const reactionCache = new Map();

      let filteredStatements = [];
      let currentIndex = 0;
      let currentQuery = "";
      let currentDate = null;
      let isAnimating = false;
      let reactionsVisible = false;
      let sideScrollPositions = { left: 0, right: 0 };

      function updateNavButtons() {
        const total = filteredStatements.length;
        prevBtn.style.opacity = currentIndex === 0 ? "0.3" : "1";
        nextBtn.style.opacity = currentIndex === total - 1 ? "0.3" : "1";
      }

      async function fetchReactions(statementId) {
        if (reactionCache.has(statementId)) return reactionCache.get(statementId);
        try {
          const response = await fetch(`/api/reactions/${encodeURIComponent(statementId)}`);
          if (response.ok) {
            const data = await response.json();
            reactionCache.set(statementId, data);
            return data;
          }
        } catch (e) { /* ignore */ }
        return null;
      }
      const ITEMS_VISIBLE = 3;

      // ── Helpers ──
      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value || "";
        return div.innerHTML;
      }

      // escapeHtml leaves quotes alone, so attribute values need their own escaping.
      function escapeAttr(value) {
        return String(value || "")
          .replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/'/g, "&#39;")
          .replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      // Only http(s) URLs from upstream data are rendered as links or images. Quotes and
      // parentheses are percent-encoded so the URL is also safe inside CSS url('...').
      function safeUrl(value) {
        try {
          const url = new URL(value);
          if (url.protocol !== "http:" && url.protocol !== "https:") return "";
          return url.href.replace(/'/g, "%27").replace(/\(/g, "%28").replace(/\)/g, "%29");
        } catch (e) {
          return "";
        }
      }

      function formatDateTime(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        const month = d.toLocaleString("en-US", { month: "short", timeZone: "UTC" }).toUpperCase();
        const day = d.getUTCDate();
        const hours = String(d.getUTCHours()).padStart(2, "0");
        const mins = String(d.getUTCMinutes()).padStart(2, "0");
        return `${month} ${day} · ${hours}:${mins} UTC`;
      }

      function highlightText(text, query) {
        if (!query || !text) return text;
        const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        return text.replace(new RegExp(`(${escaped})`, "gi"), '<mark class="highlight">$1</mark>');
      }

      function highlightHtml(html, query) {
        if (!query || !html) return html;
        const div = document.createElement("div");
        div.innerHTML = html;
        const walker = document.createTreeWalker(div, NodeFilter.SHOW_TEXT, null, false);
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);
        const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        const regex = new RegExp(`(${escaped})`, "gi");
        for (const node of textNodes) {
          if (regex.test(node.nodeValue)) {
            const span = document.createElement("span");
            span.innerHTML = node.nodeValue.replace(regex, '<mark class="highlight">$1</mark>');
            node.parentNode.replaceChild(span, node);
          }
        }
        return div.innerHTML;
      }

      function formatPercent(value) {
        if (value === null || value === undefined || Number.isNaN(value)) return "n/a";
        return `${value > 0 ? "+" : ""}${value.toFixed(2)}%`;
      }

      function formatReactionValue(value, status) {
        if (status === "closed") return "closed";
        return formatPercent(value);
      }

      // ── Card HTML ──
      function renderCard(item) {
        const rawHtml = item.content_html || escapeHtml(item.content_text || item.title || "");
        const text = currentQuery ? highlightHtml(rawHtml, currentQuery) : rawHtml;
        const originalUrl = safeUrl(item.original_url);
        const sourceUrl = safeUrl(item.source_url);
        const mediaUrl = safeUrl(item.media_url);
        const originalLink = originalUrl
          ? `<a href="${escapeAttr(originalUrl)}" target="_blank" rel="noreferrer">Truth Social</a>` : "";
        const sourceLink = sourceUrl
          ? `<a href="${escapeAttr(sourceUrl)}" target="_blank" rel="noreferrer">Archive</a>` : "";
        const links = [originalLink, sourceLink].filter(Boolean).join(" · ");
        const media = mediaUrl
          ? `<figure class="statement-media"><img src="${escapeAttr(mediaUrl)}" alt="Statement media" loading="lazy" /></figure>` : "";
        const previews = (item.link_previews || []).map((preview) => {
          const previewUrl = safeUrl(preview.url);
          if (!previewUrl) return "";
          const imageUrl = safeUrl(preview.image_url);
          const image = imageUrl
            ? `<div class="card-thumb" style="background-image:url('${escapeAttr(imageUrl)}')"></div>` : "";
          let site = preview.site_name;
          if (!site) { try { site = new URL(previewUrl).hostname.replace("www.", ""); } catch (e) { site = ""; } }
          const titleText = escapeHtml(preview.title || preview.url);
          const title = currentQuery ? highlightText(titleText, currentQuery) : titleText;
          const description = preview.description
            ? `<p>${currentQuery ? highlightText(escapeHtml(preview.description), currentQuery) : escapeHtml(preview.description)}</p>` : "";
          return `<a class="link-card" href="${escapeAttr(previewUrl)}" target="_blank" rel="noreferrer">${image}<div class="link-card-body"><span class="link-card-site">${escapeHtml(site)}</span><strong>${title}</strong>${description}</div></a>`;
        }).join("");

        return `
          <article class="card" data-id="${escapeAttr(item.id)}">
            <div class="card-header-row">
              <time class="card-time">${formatDateTime(item.published_at)}</time>
              <span class="card-reaction-summary" id="reactionSummary-${escapeAttr(item.id)}"></span>
            </div>
            <div class="card-body">${text}</div>
            ${media}
            <div class="card-links">${links}</div>
            ${previews ? `<div class="link-card-grid">${previews}</div>` : ""}
          </article>`;
      }

      // ── Dots ──
      function renderDots() {
        const total = filteredStatements.length;
        if (total <= 1) { timelineDots.innerHTML = ""; return; }
        let html = "";
        for (let i = 0; i < total; i++) {
          html += `<span class="dot${i === currentIndex ? " active" : ""}" data-index="${i}"></span>`;
        }
        timelineDots.innerHTML = html;
        timelineDots.querySelectorAll(".dot").forEach(dot => {
          dot.addEventListener("click", () => {
            const idx = Number(dot.dataset.index);
            if (!isNaN(idx) && idx !== currentIndex) goToCard(idx, true);
          });
        });
      }

      // ── Swipe animation ──
      function goToCard(newIndex, instant) {
        const total = filteredStatements.length;
        if (total === 0) return;
        newIndex = Math.max(0, Math.min(newIndex, total - 1));
        if (newIndex === currentIndex && !instant) return;
        if (!instant && isAnimating) return;

        const direction = newIndex > currentIndex ? 1 : -1;
        currentIndex = newIndex;

        if (instant) {
          carouselTrack.innerHTML = renderCard(filteredStatements[currentIndex]);
          carouselTrack.style.transition = "none";
          carouselTrack.style.transform = "translateX(0)";
          renderDots();
          updateNavButtons();
          ensureReactionSummary();
          if (reactionsVisible) loadReactionsForCurrent();
          return;
        }

        isAnimating = true;
        const cardWidth = carouselViewport.offsetWidth;
        const oldCard = carouselTrack.querySelector(".card");
        const newCardHtml = renderCard(filteredStatements[currentIndex]);

        if (oldCard) {
          oldCard.style.transition = "transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease";
          oldCard.style.transform = `translateX(${-direction * cardWidth}px)`;
          oldCard.style.opacity = "0";
        }

        setTimeout(() => {
          carouselTrack.innerHTML = newCardHtml;
          const card = carouselTrack.querySelector(".card");
          if (card) {
            card.style.transition = "none";
            card.style.transform = `translateX(${direction * cardWidth}px)`;
            card.style.opacity = "0";
            card.offsetHeight;
            card.style.transition = "transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease";
            card.style.transform = "translateX(0)";
            card.style.opacity = "1";
          }

          renderDots();
          updateNavButtons();

          ensureReactionSummary();
          if (reactionsVisible) loadReactionsForCurrent();

          setTimeout(() => { isAnimating = false; }, 300);
        }, 150);
      }

      // ── Render timeline ──
      // focusId keeps the same post on screen when the list is reloaded; otherwise show the newest.
      function renderTimeline(items, focusId = null) {
        filteredStatements = [...items].reverse();
        if (!filteredStatements.length) {
          carouselTrack.innerHTML = '<p class="muted" style="padding:3rem;text-align:center;">No matching statements.</p>';
          timelineDots.innerHTML = "";
          return;
        }
        const focusIndex = focusId ? filteredStatements.findIndex(s => s.id === focusId) : -1;
        currentIndex = focusIndex >= 0 ? focusIndex : filteredStatements.length - 1;
        carouselTrack.innerHTML = renderCard(filteredStatements[currentIndex]);
        carouselTrack.style.transition = "none";
        carouselTrack.style.transform = "translateX(0)";
        requestAnimationFrame(() => {
          renderDots();
          updateNavButtons();
        });
        ensureReactionSummary();
        if (reactionsVisible) loadReactionsForCurrent();
      }

      // ── Reactions ──
      function renderReactionBox(reaction) {
        const w = reaction.window_10h_pct, s = reaction.since_pre_pct;
        const windowClass = w > 0 ? "up" : w < 0 ? "down" : "flat";
        const sinceClass = s > 0 ? "up" : s < 0 ? "down" : "flat";
        return `
          <div class="reaction-box">
            <div class="reaction-box-name">${escapeHtml(reaction.name)}</div>
            <div class="reaction-box-metrics">
              <div class="reaction-metric">
                <div class="reaction-metric-label">10h</div>
                <div class="reaction-metric-value ${windowClass}">${formatReactionValue(reaction.window_10h_pct, reaction.window_10h_status)}</div>
              </div>
              <div class="reaction-metric">
                <div class="reaction-metric-label">Now vs pre</div>
                <div class="reaction-metric-value ${sinceClass}">${formatReactionValue(reaction.since_pre_pct, reaction.since_pre_status)}</div>
              </div>
            </div>
          </div>`;
      }

      function renderSidePanels(payload) {
        if (!payload || !payload.reactions) {
          reactionLeft.innerHTML = "";
          reactionRight.innerHTML = "";
          return;
        }

        const reactions = payload.reactions;
        const mid = Math.ceil(reactions.length / 2);
        const leftReactions = reactions.slice(0, mid);
        const rightReactions = reactions.slice(mid);

        sideScrollPositions = { left: 0, right: 0 };

        const upIcon = `<svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M5 13l5-5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        const downIcon = `<svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

        function buildSideHTML(reactions, side) {
          const boxes = reactions.map(r => renderReactionBox(r)).join("");
          const needsScroll = reactions.length > ITEMS_VISIBLE;
          const scrollBtns = needsScroll
            ? `<div class="reaction-scroll-btns">
                <button class="reaction-scroll-btn" data-side="${side}" data-dir="up" disabled>${upIcon}</button>
                <button class="reaction-scroll-btn" data-side="${side}" data-dir="down">${downIcon}</button>
              </div>`
            : "";
          return `
            <div class="reaction-side-scroll">
              <div class="reaction-side-boxes">${boxes}</div>
            </div>
            ${scrollBtns}`;
        }

        reactionLeft.innerHTML = buildSideHTML(leftReactions, "left");
        reactionRight.innerHTML = buildSideHTML(rightReactions, "right");

        // Bind scroll buttons
        reactionLeft.querySelectorAll(".reaction-scroll-btn").forEach(btn => {
          btn.addEventListener("click", () => scrollSide(btn.dataset.side, btn.dataset.dir));
        });
        reactionRight.querySelectorAll(".reaction-scroll-btn").forEach(btn => {
          btn.addEventListener("click", () => scrollSide(btn.dataset.side, btn.dataset.dir));
        });

        requestAnimationFrame(() => {
          reactionLeft.classList.add("open");
          reactionRight.classList.add("open");
        });
      }

      function scrollSide(side, dir) {
        const panel = side === "left" ? reactionLeft : reactionRight;
        const boxes = panel.querySelector(".reaction-side-boxes");
        if (!boxes) return;
        const items = boxes.children;
        const totalItems = items.length;
        if (totalItems <= ITEMS_VISIBLE) return;

        // Calculate item height (first item + gap)
        const itemHeight = items[0].offsetHeight + 8; // 8px gap
        const maxScroll = Math.max(0, totalItems - ITEMS_VISIBLE);

        if (dir === "down") {
          sideScrollPositions[side] = Math.min(sideScrollPositions[side] + 1, maxScroll);
        } else {
          sideScrollPositions[side] = Math.max(sideScrollPositions[side] - 1, 0);
        }

        boxes.style.transform = `translateY(-${sideScrollPositions[side] * itemHeight}px)`;

        // Update button states
        const upBtn = panel.querySelector('.reaction-scroll-btn[data-dir="up"]');
        const downBtn = panel.querySelector('.reaction-scroll-btn[data-dir="down"]');
        if (upBtn) upBtn.disabled = sideScrollPositions[side] === 0;
        if (downBtn) downBtn.disabled = sideScrollPositions[side] >= maxScroll;
      }

      async function loadReactionsForCurrent() {
        if (!filteredStatements.length) return;
        const item = filteredStatements[currentIndex];
        if (!item) return;

        const statementId = item.id;

        reactionLeft.innerHTML = '<div class="reaction-side-loading">Loading...</div>';
        reactionRight.innerHTML = "";
        reactionLeft.classList.add("open");

        const payload = await fetchReactions(statementId);
        if (payload) {
          renderSidePanels(payload);
          updateReactionSummary(statementId, payload);
        } else {
          reactionLeft.innerHTML = '<div class="reaction-side-loading">No data available</div>';
          reactionRight.innerHTML = "";
        }
      }

      function updateReactionSummary(statementId, payload) {
        const el = document.getElementById(`reactionSummary-${statementId}`);
        if (!el) return;
        const sp = payload?.reactions?.find(r => r.series_id === "SP500");
        const pct = (v) => {
          if (v === null || v === undefined) return "n/a";
          return `<span class="${v >= 0 ? "positive" : "negative"}">${v >= 0 ? "+" : ""}${v.toFixed(1)}%</span>`;
        };
        const status = sp?.window_10h_status;
        if (status === "ok") {
          el.innerHTML = `S&amp;P 500: 10H ${pct(sp.window_10h_pct)} | NOW VS PRE ${pct(sp.since_pre_pct)}`;
        } else if (status === "partial") {
          el.innerHTML = `S&amp;P 500: 10H SO FAR ${pct(sp.window_10h_pct)} | NOW VS PRE ${pct(sp.since_pre_pct)}`;
        } else if (status === "daily") {
          el.innerHTML = `S&amp;P 500 (DAILY): 2D ${pct(sp.window_10h_pct)} | TO DATE ${pct(sp.since_pre_pct)}`;
        } else if (status === "closed") {
          el.textContent = "S&P 500: AWAITING MARKET OPEN";
        } else {
          el.textContent = "";
        }
      }

      async function ensureReactionSummary() {
        if (!filteredStatements.length) return;
        const item = filteredStatements[currentIndex];
        if (!item) return;
        const statementId = item.id;
        const payload = await fetchReactions(statementId);
        if (payload) updateReactionSummary(statementId, payload);
      }

      function hideReactions() {
        reactionLeft.classList.remove("open");
        reactionRight.classList.remove("open");
        sideScrollPositions = { left: 0, right: 0 };
        setTimeout(() => {
          reactionLeft.innerHTML = "";
          reactionRight.innerHTML = "";
        }, 300);
      }

      // ── VIX ──
      function sparkline(points) {
        if (!points || points.length < 2) return "";
        const width = 320, height = 90, pad = 8;
        const values = points.map(pt => pt.value);
        const min = Math.min(...values), max = Math.max(...values);
        const range = max - min || 1;
        const step = (width - pad * 2) / (points.length - 1);
        const coords = points.map((pt, i) => [pad + step * i, pad + (1 - (pt.value - min) / range) * (height - pad * 2)]);
        const path = coords.map((c, i) => `${i === 0 ? "M" : "L"}${c[0]} ${c[1]}`).join(" ");
        return `<svg class="sparkline large" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><path d="${path}" /></svg>`;
      }

      function renderVixInline(series) {
        if (!series || !series.points.length) {
          vixInlineEl.innerHTML = '<p class="muted">No VIX data.</p>';
          return;
        }
        const points = series.points;
        const lastPoint = points[points.length - 1];
        vixInlineEl.innerHTML = `
          <div class="vix-inline-inner">
            <div class="vix-inline-label">
              <span class="vix-inline-title">${escapeHtml(series.name)}</span>
              <span class="vix-inline-id">30d</span>
            </div>
            <div class="vix-inline-value">${lastPoint ? lastPoint.value.toFixed(2) : "n/a"}</div>
            <div class="vix-inline-chart">${sparkline(points)}</div>
          </div>`;
      }

      // ── Data loading ──
      async function loadData(date = null, query = null, focusId = null) {
        currentDate = date;
        try {
          let url;
          if (query) url = `/api/statements?q=${encodeURIComponent(query)}`;
          else if (date) url = `/api/statements?date=${encodeURIComponent(date)}`;
          else url = `/api/statements?days=30`;
          const [statementsRes, indicatorsRes] = await Promise.all([
            fetch(url), fetch("/api/vix?days=30"),
          ]);
          if (!statementsRes.ok || !indicatorsRes.ok) throw new Error("API unavailable");
          const statements = await statementsRes.json();
          renderTimeline(statements, focusId);
          renderVixInline(await indicatorsRes.json());
        } catch (error) {
          carouselTrack.innerHTML = '<p class="muted" style="padding:3rem;text-align:center;">API unavailable. Start the Python server.</p>';
          vixInlineEl.innerHTML = '<p class="muted">Data sources are offline.</p>';
        }
      }

      // ── Search ──
      let searchDebounce = null;
      searchInput.addEventListener("input", () => {
        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
          const val = searchInput.value.trim();
          searchClear.style.display = val ? "flex" : "none";
          if (!val) { currentQuery = ""; loadData(); return; }
          currentQuery = val;
          loadData(null, val);
        }, 300);
      });

      searchClear.addEventListener("click", async () => {
        const currentId = filteredStatements[currentIndex]?.id;
        searchInput.value = "";
        searchClear.style.display = "none";
        currentQuery = "";
        await loadData();
        if (currentId) {
          const idx = filteredStatements.findIndex(s => s.id === currentId);
          if (idx >= 0) goToCard(idx, true);
        }
        searchInput.focus();
      });

      // ── Date picker ──
      const dateDropdown = document.getElementById("dateDropdown");
      const dateClearBtn = document.getElementById("dateClearBtn");
      const dateGoBtn = document.getElementById("dateGoBtn");

      datePickerBtn.addEventListener("click", () => {
        dateDropdown.classList.toggle("open");
      });

      dateGoBtn.addEventListener("click", () => {
        const val = datePicker.value;
        if (val) {
          currentQuery = "";
          searchInput.value = "";
          searchClear.style.display = "none";
          loadData(val);
        }
        dateDropdown.classList.remove("open");
      });

      dateClearBtn.addEventListener("click", () => {
        currentQuery = "";
        searchInput.value = "";
        searchClear.style.display = "none";
        loadData();
        dateDropdown.classList.remove("open");
      });

      document.addEventListener("click", (e) => {
        if (!dateDropdown.contains(e.target) && !datePickerBtn.contains(e.target)) {
          dateDropdown.classList.remove("open");
        }
      });

      // ── Reaction toggle ──
      reactionToggleBtn.addEventListener("click", () => {
        reactionsVisible = !reactionsVisible;
        reactionToggleBtn.classList.toggle("active", reactionsVisible);
        searchBar.classList.toggle("reactions-active", reactionsVisible);
        if (reactionsVisible) {
          loadReactionsForCurrent();
        } else {
          hideReactions();
        }
      });

      // ── Data refresh ──
      const refreshBtn = document.getElementById("refreshBtn");
      const REFRESH_POLL_MS = 1500;
      const DATA_STEPS = new Set(["rss", "intraday", "fred", "link_previews"]);
      let refreshWatching = false;

      async function fetchRefreshStatus() {
        const res = await fetch("/api/refresh/status");
        if (!res.ok) throw new Error("status unavailable");
        return res.json();
      }

      function setRefreshButton(state, title) {
        refreshBtn.classList.toggle("running", state === "running");
        refreshBtn.classList.toggle("failed", state === "failed");
        refreshBtn.title = title;
      }

      // Reload the current view in place (same filters, same post) once new data has landed.
      async function reloadCurrentView() {
        if (isAnimating) {
          await new Promise(resolve => setTimeout(resolve, 400));
          return reloadCurrentView();
        }
        reactionCache.clear();
        const focusId = filteredStatements[currentIndex]?.id || null;
        await loadData(currentDate, currentQuery || null, focusId);
      }

      // Poll while a server-side refresh runs, reloading as each data source finishes.
      async function watchRefresh() {
        if (refreshWatching) return;
        refreshWatching = true;
        setRefreshButton("running", "Fetching latest data…");
        let seen = 0;
        try {
          while (true) {
            const status = await fetchRefreshStatus();
            const results = status.results || [];
            const finished = results.slice(seen);
            seen = results.length;
            if (finished.some(r => DATA_STEPS.has(r.step) && r.status === "ok")) {
              await reloadCurrentView();
            }
            if (!status.running) {
              const failed = results.filter(r => r.status !== "ok").map(r => r.step);
              if (failed.length) {
                setRefreshButton("failed", `Last refresh had problems with: ${failed.join(", ")}. Click to retry.`);
              } else {
                setRefreshButton("idle", `Data updated ${formatDateTime(status.last_run)}. Click to fetch latest.`);
              }
              break;
            }
            await new Promise(resolve => setTimeout(resolve, REFRESH_POLL_MS));
          }
        } catch (e) {
          setRefreshButton("failed", "Couldn't reach the server to check the refresh. Click to retry.");
        } finally {
          refreshWatching = false;
        }
      }

      refreshBtn.addEventListener("click", async () => {
        if (refreshWatching) return;
        try {
          const res = await fetch("/api/refresh", { method: "POST" });
          if (!res.ok) throw new Error("refresh failed to start");
        } catch (e) {
          setRefreshButton("failed", "Couldn't start a refresh. Click to retry.");
          return;
        }
        watchRefresh();
      });

      // ── Navigation ──
      prevBtn.addEventListener("click", () => goToCard(currentIndex - 1));
      nextBtn.addEventListener("click", () => goToCard(currentIndex + 1));


      document.addEventListener("keydown", (e) => {
        if (e.target === searchInput) return;
        if (e.key === "ArrowLeft") goToCard(currentIndex - 1);
        if (e.key === "ArrowRight") goToCard(currentIndex + 1);
      });

      // ── Touch/swipe ──
      let touchStartX = 0, touchDeltaX = 0;
      carouselViewport.addEventListener("touchstart", (e) => {
        touchStartX = e.touches[0].clientX;
        touchDeltaX = 0;
      }, { passive: true });
      carouselViewport.addEventListener("touchmove", (e) => {
        touchDeltaX = e.touches[0].clientX - touchStartX;
      }, { passive: true });
      carouselViewport.addEventListener("touchend", () => {
        const threshold = carouselViewport.offsetWidth * 0.15;
        if (touchDeltaX > threshold) goToCard(currentIndex + 1);
        else if (touchDeltaX < -threshold) goToCard(currentIndex - 1);
      });

      window.addEventListener("resize", () => {
        if (filteredStatements.length > 0) goToCard(currentIndex, true);
      });

      loadData();
      // The server may already be refreshing (it starts one on boot); follow it if so.
      fetchRefreshStatus().then((status) => {
        if (status.running) watchRefresh();
        else if (status.last_run) setRefreshButton("idle", `Data updated ${formatDateTime(status.last_run)}. Click to fetch latest.`);
      }).catch(() => {});
    })();
    </script>
  </body>
</html>
