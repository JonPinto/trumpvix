name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app to prevent cold start
        run: |
          curl -f -s --max-time 30 "${{ secrets.APP_URL }}" > /dev/null
          echo "Pinged ${{ secrets.APP_URL }}"
