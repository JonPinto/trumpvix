name: Ingest after deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deploy
        run: sleep 180

      - name: Start ingestion
        run: curl -sf "${{ secrets.APP_URL }}/api/refresh"

      - name: Wait for completion
        run: sleep 360

      - name: Check results
        run: curl -sf "${{ secrets.APP_URL }}/api/refresh/status" | python -m json.tool
