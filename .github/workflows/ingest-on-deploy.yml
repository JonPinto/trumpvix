name: Ingest after deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deploy
        run: sleep 120

      - name: Trigger ingestion
        run: |
          curl -sf "${{ secrets.APP_URL }}/api/refresh" | python -m json.tool
